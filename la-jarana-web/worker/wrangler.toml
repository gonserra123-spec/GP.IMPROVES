name = "la-jarana-comunicados"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Orígenes que pueden llamar al Worker (separados por comas). Añade el dominio real cuando exista.
ALLOWED_ORIGINS = "http://localhost:5210,http://localhost:4210"
# OJO: CORS no es autenticación; cualquiera puede llamar al Worker. La cuota se protege con los
# límites por IP y con este tope global diario (requiere el KV de abajo).
GLOBAL_DAILY_MAX = "500"
# GEMINI_MODEL = "gemini-2.5-flash"

# 5 peticiones por minuto y por IP (Workers Rate Limiting).
[[ratelimits]]
name = "RL_MIN"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# 30 al día por IP (opcional): crea el KV con `npx wrangler kv namespace create RL_KV`
# y descomenta pegando el id que te devuelva.
# [[kv_namespaces]]
# binding = "RL_KV"
# id = "<id>"

# La clave NO va aquí. Introdúcela tú en tu terminal:
#   npx wrangler secret put GEMINI_API_KEY
